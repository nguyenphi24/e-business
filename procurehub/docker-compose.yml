services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: procurehub
      POSTGRES_USER: procurehub
      POSTGRES_PASSWORD: procurehub
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurehub -d procurehub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
