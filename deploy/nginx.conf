worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Giữ X-Forwarded-Proto của proxy TLS phía trước (nếu có), không thì dùng scheme hiện tại.
  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

  server {
    listen 80 default_server;
    client_max_body_size 10m;

    location = /health/ {
      proxy_pass http://127.0.0.1:8080/health/;
    }

    # ProcureHub API (kể cả SSE thông báo /api/v1/notifications/stream -> tắt buffer)
    location /api/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 120s;
    }

    # Trang người dùng của sandbox (thanh toán, ký OTP, tra cứu hóa đơn). API của sandbox KHÔNG mở ra ngoài,
    # backend gọi nội bộ qua 127.0.0.1:8000.
    location ~ ^/(gateway/checkout|esign/sign|einvoice)/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # SPA (React Router): file thật thì trả file, còn lại về index.html
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
    location /assets/ {
      root /usr/share/nginx/html;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }
  }
}
