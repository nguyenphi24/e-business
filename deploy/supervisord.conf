[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/local/pgbin/postgres -D /data/pg -c listen_addresses=127.0.0.1
user=postgres
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/bin/bash -c "set -a; . /data/backend.env; set +a; exec gunicorn -c gunicorn.conf.py --bind 127.0.0.1:8080 config.wsgi:application"
directory=/srv/procurehub
environment=HOME="/home/app"
user=app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sandbox]
command=/bin/bash -c "set -a; . /data/sandbox.env; set +a; exec gunicorn -c gunicorn.conf.py --bind 127.0.0.1:8000 config.wsgi:application"
directory=/srv/sandbox
environment=HOME="/home/app"
user=app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
